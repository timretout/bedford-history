<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bedford History — timeline-led layout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Roboto, Arial, sans-serif;color:#202124;background:#ffffff}
a{color:#1a73e8}a:hover{color:#174ea6}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 100%; min-height: 1060px; background: #ffffff; font-family: Roboto, Arial, sans-serif">

  <header style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap; min-height: 64px; padding: 8px 24px; box-sizing: border-box; border-bottom: 1px solid #dadce0">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b3261e" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9h3v3h3V9h3v3h3V9h3v12z"></path><path d="M10 21v-4h4v4"></path></svg>
      <span style="font-size: 20px; font-weight: 500; color: #202124">Bedford History</span>
    </div>
    <form role="search" style="flex: 1; min-width: 240px; max-width: 560px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 22px; background: #f1f3f4">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="q2" class="sr-only">Search places, people and events</label>
      <input id="q2" type="search" placeholder="Search places, people and events" style="flex: 1; min-width: 0; border: 0; outline: none; background: none; font: 400 15px Roboto, Arial, sans-serif; color: #202124">
    </form>
    <nav aria-label="Site" style="display: flex; gap: 20px; margin-left: auto; font-size: 14px">
      <a href="#about" style="text-decoration: none; color: #3c4043">About</a>
      <a href="#sources" style="text-decoration: none; color: #3c4043">Sources</a>
      <a href="#contribute" style="text-decoration: none; color: #3c4043">Suggest a place</a>
    </nav>
  </header>

  <div style="position: relative; height: 480px; overflow: hidden; background: #f1f3f4">
    <svg width="992" height="558" viewBox="0 0 1600 900" aria-hidden="true" style="position: absolute; left: calc(50% - 620px); top: -20px">
      <defs>
        <path id="tj1" d="M860,40 L860,520 L866,600 L960,900"/>
        <path id="tj2" d="M860,182 L560,122 L0,70"/>
        <path id="tj3" d="M860,382 L620,352 L0,392"/>
        <path id="tj4" d="M876,206 L1200,236 L1600,262"/>
        <path id="tj5" d="M876,528 L1250,680 L1600,800"/>
        <path id="tn1" d="M860,360 L1130,348"/>
        <path id="tn2" d="M900,462 C1000,468 1120,494 1250,512 C1380,532 1480,494 1600,480"/>
        <path id="tn3" d="M990,0 L962,140 L876,204"/>
        <path id="tn4" d="M860,190 L770,0"/>
        <path id="tn5" d="M862,524 L640,900"/>
        <path id="tn6" d="M860,330 L740,330 L700,300 L700,150"/>
        <path id="tn7" d="M860,420 L1010,420"/>
        <path id="tn8" d="M1010,240 L1020,420"/>
        <path id="tn9" d="M1110,244 L1118,350"/>
        <path id="tn10" d="M700,360 L706,500"/>
        <path id="tn11" d="M600,128 L620,352"/>
        <path id="tn12" d="M1260,240 L1262,510"/>
        <path id="tn13" d="M1410,268 L1410,500"/>
        <path id="tn14" d="M640,560 L866,600"/>
        <path id="tn15" d="M960,720 L1250,700"/>
      </defs>
      <rect width="1600" height="900" fill="#f1f3f4"/>
      <g fill="#e8eaed">
        <rect x="620" y="150" width="225" height="190" rx="6"/>
        <rect x="878" y="225" width="310" height="115" rx="6"/>
        <rect x="878" y="368" width="240" height="40" rx="6"/>
        <rect x="460" y="400" width="220" height="100" rx="6"/>
        <rect x="900" y="560" width="220" height="70" rx="6"/>
        <rect x="660" y="620" width="180" height="200" rx="6"/>
        <rect x="1280" y="280" width="300" height="200" rx="6"/>
      </g>
      <g fill="#ceead6">
        <path d="M1070,58 L1300,78 L1312,212 L1092,222 Z"/>
        <circle cx="962" cy="446" r="30"/>
        <path d="M920,510 C1050,512 1200,560 1350,566 L1346,600 C1200,594 1050,560 930,548 Z"/>
        <path d="M1180,612 L1390,622 L1380,730 L1170,712 Z"/>
      </g>
      <path d="M790,520 C810,600 900,640 1000,640 C1080,640 1120,600 1140,535" fill="none" stroke="#aadaff" stroke-width="7" stroke-linecap="round"/>
      <path d="M0,520 C180,500 340,570 520,540 C700,510 760,480 880,488 C1000,496 1120,520 1250,540 C1380,560 1480,520 1600,505" fill="none" stroke="#aadaff" stroke-width="30" stroke-linecap="round"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g stroke="#dadce0" stroke-width="11">
          <use href="#tn1"/><use href="#tn2"/><use href="#tn3"/><use href="#tn4"/><use href="#tn5"/><use href="#tn6"/><use href="#tn7"/><use href="#tn8"/><use href="#tn9"/><use href="#tn10"/><use href="#tn11"/><use href="#tn12"/><use href="#tn13"/><use href="#tn14"/><use href="#tn15"/>
        </g>
        <g stroke="#ffffff" stroke-width="8">
          <use href="#tn1"/><use href="#tn2"/><use href="#tn3"/><use href="#tn4"/><use href="#tn5"/><use href="#tn6"/><use href="#tn7"/><use href="#tn8"/><use href="#tn9"/><use href="#tn10"/><use href="#tn11"/><use href="#tn12"/><use href="#tn13"/><use href="#tn14"/><use href="#tn15"/>
        </g>
        <g stroke="#e3b341" stroke-width="14"><use href="#tj1"/><use href="#tj2"/><use href="#tj3"/><use href="#tj4"/><use href="#tj5"/></g>
        <g stroke="#fde293" stroke-width="10"><use href="#tj1"/><use href="#tj2"/><use href="#tj3"/><use href="#tj4"/><use href="#tj5"/></g>
      </g>
      <path d="M500,0 L560,300 L610,520 L690,900" fill="none" stroke="#9aa0a6" stroke-width="5"/>
      <path d="M500,0 L560,300 L610,520 L690,900" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 10"/>
      <g font-family="Roboto, Arial, sans-serif">
        <text x="240" y="548" font-size="18" font-style="italic" fill="#3b6fb6" transform="rotate(5 240 548)">River Great Ouse</text>
        <text x="660" y="250" font-size="18" font-weight="700" letter-spacing="3" fill="#80868b">TOWN CENTRE</text>
        <text x="1110" y="98" font-size="17" fill="#137333">Bedford Park</text>
        <text x="880" y="672" font-size="17" font-style="italic" fill="#3b6fb6">King's Ditch</text>
      </g>
    </svg>

    <sc-for list="{{pins}}" as="p" hint-placeholder-count="15">
      <span aria-hidden="true" style="position: absolute; left: calc(50% + {{p.dx}}px); top: {{p.py}}px; transform: translate(-50%, -50%); width: {{p.size}}px; height: {{p.size}}px; border-radius: 50%; background: {{p.color}}; border: 2px solid #ffffff; box-shadow: 0 1px 3px rgba(60,64,67,.5); color: #ffffff; font: 700 12px Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center">{{p.n}}</span>
    </sc-for>

    <div style="position: absolute; left: calc(50% - 25px); top: 238px; transform: translate(-50%, -100%); width: 260px; background: #ffffff; border-radius: 12px; box-shadow: 0 3px 14px rgba(0,0,0,.25); padding: 14px 16px">
      <div style="font-size: 12px; font-weight: 500; color: #b3261e; letter-spacing: .5px">MEDIEVAL · 1224</div>
      <div style="font-size: 16px; font-weight: 500; color: #202124; margin-top: 4px">Bedford Castle</div>
      <div style="font-size: 13px; line-height: 18px; color: #3c4043; margin-top: 4px">Henry III besieges the castle for eight weeks, then has it slighted.</div>
      <a href="https://en.wikipedia.org/wiki/Bedford_Castle" style="display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 500">Read on Wikipedia</a>
      <div style="position: absolute; left: 50%; bottom: -8px; width: 16px; height: 16px; margin-left: -8px; background: #ffffff; transform: rotate(45deg)"></div>
    </div>

    <div style="position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; background: #ffffff; border-radius: 8px; box-shadow: 0 1px 4px rgba(60,64,67,.4); overflow: hidden">
      <button type="button" aria-label="Zoom in" style="width: 44px; height: 44px; border: 0; background: #ffffff; color: #5f6368; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button type="button" aria-label="Zoom out" style="width: 44px; height: 44px; border: 0; border-top: 1px solid #e8eaed; background: #ffffff; color: #5f6368; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    </div>
    <div style="position: absolute; left: 16px; bottom: 16px; display: flex; gap: 4px; padding: 4px; background: #ffffff; border-radius: 8px; box-shadow: 0 1px 4px rgba(60,64,67,.4)">
      <button type="button" aria-pressed="true" style="height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: #e8f0fe; color: #174ea6; font: 500 13px Roboto, Arial, sans-serif">Modern</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: #ffffff; color: #3c4043; font: 500 13px Roboto, Arial, sans-serif">OS 1880s</button>
      <button type="button" aria-pressed="false" style="height: 36px; padding: 0 12px; border: 0; border-radius: 6px; background: #ffffff; color: #3c4043; font: 500 13px Roboto, Arial, sans-serif">Speed 1610</button>
    </div>
  </div>

  <section aria-label="Timeline" style="padding: 20px 24px 32px">
    <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 500; color: #202124">Timeline</h2>
      <button type="button" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px 0 12px; border: 0; border-radius: 18px; background: #1a73e8; color: #ffffff; font: 500 14px Roboto, Arial, sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg>Play through time</button>
      <span style="font-size: 13px; color: #5f6368">15 places · numbers match the map</span>
      <div role="group" aria-label="Timeline scale" style="display: flex; margin-left: auto; border: 1px solid #dadce0; border-radius: 18px; overflow: hidden">
        <button type="button" aria-pressed="true" style="height: 34px; padding: 0 14px; border: 0; background: #e8f0fe; color: #174ea6; font: 500 13px Roboto, Arial, sans-serif">Eras</button>
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: 0; border-left: 1px solid #dadce0; background: #ffffff; color: #3c4043; font: 500 13px Roboto, Arial, sans-serif">Centuries</button>
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 14px; border: 0; border-left: 1px solid #dadce0; background: #ffffff; color: #3c4043; font: 500 13px Roboto, Arial, sans-serif">To scale</button>
      </div>
    </div>
    <div style="overflow-x: auto">
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; min-width: 1080px">
        <sc-for list="{{cols}}" as="c" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="padding: 10px 12px; background: {{c.tint}}; border-top: 4px solid {{c.color}}; border-radius: 0 0 6px 6px">
              <div style="font-size: 14px; font-weight: 500; color: #202124">{{c.name}}</div>
              <div style="font-size: 12px; color: #5f6368">{{c.span}}</div>
            </div>
            <sc-for list="{{c.events}}" as="e" hint-placeholder-count="3">
              <article style="display: flex; gap: 10px; padding: 10px 12px; border: {{e.border}}; border-radius: 8px; background: #ffffff; box-shadow: {{e.shadow}}">
                <span aria-hidden="true" style="flex: none; width: 22px; height: 22px; border-radius: 50%; background: {{c.color}}; color: #ffffff; font: 700 11px Roboto, Arial, sans-serif; display: flex; align-items: center; justify-content: center">{{e.n}}</span>
                <div style="min-width: 0">
                  <div style="font-size: 13px; font-weight: 700; color: #202124">{{e.yearLabel}}</div>
                  <div style="font-size: 13px; line-height: 18px; color: #3c4043">{{e.event}}</div>
                  <div style="font-size: 12px; color: #5f6368; margin-top: 2px">{{e.title}}</div>
                </div>
              </article>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1060}}'>
var ERAS = [
  { id: 'saxon', name: 'Anglo-Saxon', from: 500, to: 1066, color: '#7b5ea7' },
  { id: 'medieval', name: 'Medieval', from: 1066, to: 1485, color: '#b3261e' },
  { id: 'tudor', name: 'Tudor & Stuart', from: 1485, to: 1714, color: '#c26401' },
  { id: 'georgian', name: 'Georgian', from: 1714, to: 1837, color: '#188038' },
  { id: 'victorian', name: 'Victorian', from: 1837, to: 1901, color: '#1a73e8' },
  { id: 'modern', name: '20th century', from: 1901, to: 2026, color: '#3c4043' }
];
var PLACES = [
  { id: 'burh', title: "King's Ditch", event: 'Edward the Elder fortifies the south bank', era: 'saxon', year: 915, yearLabel: '915', x: 1000, y: 640 },
  { id: 'castle', title: 'Bedford Castle', event: 'Siege of Bedford Castle', era: 'medieval', year: 1224, yearLabel: '1224', x: 960, y: 448 },
  { id: 'stpauls', title: "St Paul's Church", event: 'The town church takes its medieval form', era: 'medieval', year: 1300, yearLabel: 'c. 1300', x: 822, y: 432 },
  { id: 'school', title: 'Bedford School', event: 'Bedford School founded', era: 'tudor', year: 1552, yearLabel: '1552', x: 975, y: 120 },
  { id: 'gaol', title: 'County Gaol', event: 'John Bunyan imprisoned', era: 'tudor', year: 1660, yearLabel: '1660–72', x: 848, y: 330 },
  { id: 'meeting', title: 'Bunyan Meeting', event: 'Bunyan’s congregation buys a barn on Mill Street', era: 'tudor', year: 1672, yearLabel: '1672', x: 1000, y: 354 },
  { id: 'swan', title: 'The Swan Hotel', event: 'The Swan rebuilt for the Duke of Bedford', era: 'georgian', year: 1794, yearLabel: '1794', x: 908, y: 466 },
  { id: 'bridge', title: 'Town Bridge', event: 'The new Town Bridge opens', era: 'georgian', year: 1813, yearLabel: '1813', x: 860, y: 488 },
  { id: 'station', title: 'Midland Railway', event: 'The railway reaches Bedford', era: 'victorian', year: 1857, yearLabel: '1857', x: 595, y: 338 },
  { id: 'statue', title: 'Bunyan Statue', event: 'Bunyan statue unveiled', era: 'victorian', year: 1874, yearLabel: '1874', x: 878, y: 212 },
  { id: 'park', title: 'Bedford Park', event: 'Bedford Park opens', era: 'victorian', year: 1888, yearLabel: '1888', x: 1185, y: 150 },
  { id: 'suspension', title: 'Suspension Bridge', event: 'Suspension Bridge built on the Embankment', era: 'victorian', year: 1888, yearLabel: '1888', x: 1300, y: 548 },
  { id: 'panacea', title: 'Panacea Society', event: 'The Panacea Society is founded', era: 'modern', year: 1919, yearLabel: '1919', x: 1110, y: 262 },
  { id: 'r101', title: 'Cardington Sheds', event: 'R101 lost on its maiden voyage', era: 'modern', year: 1930, yearLabel: '1930', x: 1470, y: 745 },
  { id: 'corn', title: 'Corn Exchange', event: 'Glenn Miller broadcasts from Bedford', era: 'modern', year: 1944, yearLabel: '1944', x: 765, y: 400 }
];

class Component extends DCLogic {
  renderVals() {
    var sel = 'castle';
    var color = {};
    ERAS.forEach(function (e) { color[e.id] = e.color; });
    var numbered = PLACES.map(function (p, i) { return Object.assign({ n: i + 1 }, p); });
    return {
      pins: numbered.filter(function (p) { return p.id !== sel; }).concat(numbered.filter(function (p) { return p.id === sel; })).map(function (p) {
        return { n: p.n, color: color[p.era], size: p.id === sel ? 32 : 24, dx: Math.round(p.x * 0.62 - 620), py: Math.round(p.y * 0.62 - 20) };
      }),
      cols: ERAS.map(function (e) {
        return {
          name: e.name, color: e.color, tint: e.color + '1f',
          span: e.from + '–' + (e.id === 'modern' ? 'now' : e.to),
          events: numbered.filter(function (p) { return p.era === e.id; }).map(function (p) {
            var on = p.id === sel;
            return Object.assign({}, p, {
              border: on ? '2px solid ' + e.color : '1px solid #dadce0',
              shadow: on ? '0 2px 8px rgba(60,64,67,.25)' : 'none'
            });
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
